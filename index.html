<!DOCTYPE html>
<html lang="ja">
<head>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4A3358">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="No.8カルテ">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
</head>
<body>
<!-- 美容師向け電子カルテアプリ モックアップ -->
<style>
  :root{
    --ink:#4A3358;
    --ink-soft:#9C86AA;
    --paper:#FFFFFF;
    --paper-raised:#FFFFFF;
    --line:#F0E3EF;
    --accent:#E8478B;      /* vibrant pink/magenta, from the icon */
    --accent-soft:#FCE6F0;
    --sage:#2FB8AC;        /* teal/mint, secondary */
    --sage-soft:#E3F8F5;
    --warn:#F2A93B;        /* warm yellow/orange */
    --font-display:'Shippori Mincho', serif;
    --font-body:'Zen Kaku Gothic New','Noto Sans JP',sans-serif;
  }
  *{box-sizing:border-box;}
  #karte-root{
    font-family:var(--font-body);
    background:var(--paper);
    color:var(--ink);
    width:100%;
    min-height:640px;
    max-width:480px;
    margin:0 auto;
    border-radius:20px;
    overflow:hidden;
    border:1px solid var(--line);
    box-shadow:0 20px 50px -25px rgba(43,38,34,0.35);
    display:flex;
    flex-direction:column;
  }
  .kt-header{
    padding:18px 18px 14px;
    background:var(--paper-raised);
    border-bottom:1px solid var(--line);
  }
  .kt-brand{
    font-family:var(--font-display);
    font-size:13px;
    letter-spacing:0.28em;
    color:var(--accent);
    margin-bottom:2px;
  }
  .kt-title{
    font-family:var(--font-display);
    font-size:22px;
    font-weight:600;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .kt-search{
    margin-top:12px;
    position:relative;
  }
  .kt-search input{
    width:100%;
    padding:14px 16px 14px 42px;
    border-radius:14px;
    border:1px solid var(--line);
    background:var(--paper);
    font-size:16px;
    font-family:var(--font-body);
    color:var(--ink);
  }
  .kt-search input:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .kt-search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:0.5;}
  .kt-indexrow{
    display:flex;align-items:center;gap:6px;margin-top:10px;
  }
  .kt-staffrow-label{
    flex:0 0 auto;font-size:11px;color:var(--ink-soft);font-weight:600;
  }
  .kt-gyou-scroll{
    display:flex;gap:6px;overflow-x:auto;flex:1;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    padding-bottom:2px;
  }
  .kt-gyou-scroll::-webkit-scrollbar{display:none;}
  .kt-chip{
    flex:0 0 auto;
    padding:7px 13px;
    border-radius:20px;
    border:1px solid var(--line);
    background:var(--paper);
    font-family:var(--font-body);
    font-size:13px;
    font-weight:600;
    color:var(--ink-soft);
    cursor:pointer;
    white-space:nowrap;
  }
  .kt-chip.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  .kt-sort-toggle{
    flex:0 0 auto;
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--ink-soft);
    border-radius:10px;
    font-size:11px;
    padding:8px 9px;
    line-height:1.3;
    cursor:pointer;
    font-family:var(--font-body);
    text-align:center;
  }
  .kt-menu-head{
    display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;
  }
  .kt-menu-edit-link{
    border:none;background:none;color:var(--accent);font-size:12px;font-weight:700;
    font-family:var(--font-body);cursor:pointer;padding:2px 4px;
  }
  .kt-menu-chips{
    display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;
  }
  .kt-menu-chip{
    padding:9px 14px;border-radius:20px;border:1px solid var(--sage);
    background:var(--sage-soft);color:var(--ink);font-size:13px;font-weight:600;
    font-family:var(--font-body);cursor:pointer;
  }
  .kt-menu-chip:active{transform:scale(0.96);}
  .kt-menu-chip.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .kt-menu-editor{
    background:var(--paper);border:1px dashed var(--line);border-radius:12px;
    padding:12px;margin-bottom:14px;
  }
  .kt-menu-edit-row{
    display:flex;align-items:center;gap:8px;margin-bottom:8px;
  }
  .kt-menu-edit-row input{
    flex:1;padding:9px 10px;border:1px solid var(--line);border-radius:8px;
    font-family:var(--font-body);font-size:13px;background:var(--paper-raised);color:var(--ink);
  }
  .kt-menu-edit-row button{
    flex:0 0 auto;width:30px;height:30px;border-radius:8px;border:none;
    background:var(--accent-soft);color:var(--accent);font-size:14px;cursor:pointer;
  }
  .kt-menu-editor-actions{
    display:flex;gap:8px;margin-top:6px;
  }
  .kt-menu-editor-actions button{
    flex:1;padding:10px;border-radius:9px;border:none;font-size:12px;font-weight:700;
    font-family:var(--font-body);cursor:pointer;
  }
  .kt-menu-add-btn{background:var(--sage-soft);color:var(--ink);}
  .kt-menu-save-btn{background:var(--ink);color:#fff;}
  .kt-menu-reset-btn{background:transparent;color:var(--ink-soft);text-decoration:underline;}
  .kt-recipe-pill-wrap{
    display:flex;align-items:center;gap:10px;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    padding:8px 4px;
  }
  .kt-recipe-pill{
    position:relative;
    display:flex;flex-direction:column;flex:0 0 auto;
    border:1.5px solid var(--accent);
    border-radius:14px;
    background:var(--paper-raised);
    overflow:hidden;
    width:76px;
  }
  .kt-recipe-box{
    border:none;background:transparent;
    text-align:center;
    font-family:var(--font-body);font-size:14px;color:var(--ink);
    padding:10px 4px;
    width:100%;
  }
  .kt-recipe-box.kt-recipe-name-input{font-weight:600;border-bottom:1.5px solid var(--accent);}
  .kt-recipe-box:focus{outline:none;background:var(--accent-soft);}
  .kt-recipe-del-mini{
    position:absolute;top:-8px;right:-8px;
    width:20px;height:20px;line-height:20px;
    border:1.5px solid var(--accent);border-radius:50%;
    background:var(--paper-raised);color:var(--accent);
    font-size:10px;padding:0;cursor:pointer;text-align:center;
  }
  .kt-recipe-colon-between{
    flex:0 0 auto;color:var(--ink-soft);font-size:17px;font-weight:700;
  }
  .kt-ratio-picker-wrap{
    position:relative;height:48px;overflow:hidden;
    -webkit-mask-image:linear-gradient(to bottom, transparent 0%, black 35%, black 65%, transparent 100%);
    mask-image:linear-gradient(to bottom, transparent 0%, black 35%, black 65%, transparent 100%);
  }
  .kt-ratio-picker-track{
    display:flex;flex-direction:column;
    height:48px;overflow-y:auto;
    scroll-snap-type:y mandatory;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .kt-ratio-picker-track::-webkit-scrollbar{display:none;}
  .kt-ratio-item{
    flex:0 0 18px;height:18px;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-body);font-size:12px;color:var(--ink-soft);opacity:0.5;
    scroll-snap-align:center;
    transition:color .15s ease, font-size .15s ease, opacity .15s ease;
  }
  .kt-ratio-item.active{
    color:var(--accent);font-weight:700;font-size:15px;opacity:1;
  }
  .kt-ratio-picker-indicator{
    position:absolute;left:6px;right:6px;top:50%;height:18px;
    transform:translateY(-50%);
    border-top:1px solid var(--accent);border-bottom:1px solid var(--accent);
    pointer-events:none;
  }
  .kt-body{
    flex:1;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:12px 14px 90px;
  }
  .kt-count{
    font-size:12px;
    color:var(--ink-soft);
    padding:6px 4px 10px;
    letter-spacing:0.05em;
  }
  .kt-row{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 14px;
    margin-bottom:9px;
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;
    position:relative;
    overflow:hidden;
  }
  .kt-row:active{transform:scale(0.98);}
  .kt-row .kt-tab{
    position:absolute;left:0;top:0;bottom:0;width:5px;
  }
  .kt-tab.recent{background:var(--sage);}
  .kt-tab.mid{background:#F2C94C;}
  .kt-tab.old{background:#C9B8E0;}
  .kt-row .kt-no{
    font-family:var(--font-display);
    font-size:12px;
    color:var(--ink-soft);
    min-width:44px;
  }
  .kt-row .kt-namewrap{flex:1;min-width:0;}
  .kt-row .kt-name{font-size:16px;font-weight:600;}
  .kt-row .kt-kana{font-size:11px;color:var(--ink-soft);margin-top:1px;}
  .kt-row .kt-lastvisit{font-size:11px;color:var(--ink-soft);white-space:nowrap;}
  .kt-empty{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
  }
  .kt-empty .kt-em-icon{font-size:32px;margin-bottom:10px;}
  .kt-fab{
    position:absolute;
    right:16px;
    bottom:16px;
    background:var(--ink);
    color:#fff;
    border:none;
    border-radius:16px;
    padding:15px 20px;
    font-size:15px;
    font-family:var(--font-body);
    font-weight:600;
    display:flex;
    align-items:center;
    gap:8px;
    box-shadow:0 10px 24px -8px rgba(43,38,34,0.5);
    cursor:pointer;
  }
  .kt-fab:active{transform:scale(0.96);}

  /* screens */
  .kt-screen{display:none;flex-direction:column;height:100%;}
  .kt-screen.active{display:flex;}
  .kt-topbar{
    display:flex;align-items:center;gap:10px;
    padding:14px 14px;
    background:var(--paper-raised);
    border-bottom:1px solid var(--line);
  }
  .kt-back{
    border:none;background:var(--sage-soft);color:var(--ink);
    width:38px;height:38px;border-radius:12px;font-size:18px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .kt-topbar .kt-topbar-title{font-family:var(--font-display);font-size:17px;font-weight:600;flex:1;min-width:0;}
  .kt-topbar .kt-topbar-sub{font-size:11px;color:var(--ink-soft);}

  .kt-scroll{flex:1;overflow-y:auto;padding:16px 16px 100px;}

  .kt-card{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:16px;
    padding:16px;
    margin-bottom:14px;
  }
  .kt-card-label{
    font-size:11px;letter-spacing:0.1em;color:var(--accent);font-weight:700;margin-bottom:8px;
  }
  .kt-field{margin-bottom:12px;}
  .kt-field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:5px;}
  .kt-field input, .kt-field textarea{
    width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:10px;
    font-family:var(--font-body);font-size:15px;background:var(--paper);color:var(--ink);
  }
  .kt-field input:focus, .kt-field textarea:focus{outline:2px solid var(--accent);outline-offset:0;}
  .kt-field textarea{resize:vertical;min-height:64px;}
  .kt-readonly{color:var(--ink-soft);background:var(--sage-soft) !important;}

  .kt-btn{
    width:100%;padding:15px;border-radius:13px;border:none;font-size:15px;font-weight:700;
    font-family:var(--font-body);cursor:pointer;
  }
  .kt-btn-primary{background:var(--ink);color:#fff;}
  .kt-btn-primary:active{transform:scale(0.98);}
  .kt-btn-ghost{background:transparent;color:var(--accent);border:1px solid var(--accent);}
  .kt-btn-row{display:flex;gap:10px;margin-top:6px;}

  .kt-history-item{
    background:var(--paper-raised);border:1px solid var(--line);border-radius:16px;
    margin-bottom:12px;overflow:hidden;cursor:pointer;
  }
  .kt-history-head{
    display:flex;justify-content:space-between;align-items:center;
    padding:12px 14px;background:var(--accent-soft);
  }
  .kt-history-date{font-family:var(--font-display);font-weight:600;font-size:14px;}
  .kt-history-staff{font-family:var(--font-body);font-weight:600;font-size:11px;color:var(--ink-soft);}
  .kt-history-time{font-size:11px;color:var(--ink-soft);}
  .kt-photos{display:flex;gap:1px;background:var(--line);}
  .kt-photo-box{flex:1;aspect-ratio:1/1;background:#FBEFF6;position:relative;overflow:hidden;}
  .kt-photo-box img{width:100%;height:100%;object-fit:cover;display:block;}
  .kt-photo-box .kt-photo-tag{
    position:absolute;top:6px;left:6px;font-size:9px;letter-spacing:0.08em;
    background:rgba(74,59,70,0.65);color:#fff;padding:2px 7px;border-radius:20px;
  }
  .kt-photo-box .kt-photo-tag-style{background:rgba(124,132,113,0.85);}
  .kt-photo-box .kt-photo-empty{
    display:flex;align-items:center;justify-content:center;height:100%;color:#D2B8DA;font-size:11px;
  }
  .kt-history-body{padding:12px 14px;}
  .kt-history-price{
    font-size:13px;font-weight:700;color:#B8860B;margin-bottom:8px;
    display:inline-block;background:#FFF6DE;padding:3px 10px;border-radius:20px;
  }
  .kt-history-recipe{font-size:13px;color:var(--ink);white-space:pre-wrap;margin-bottom:6px;}
  .kt-history-tagline{font-size:11.5px;color:var(--sage);font-weight:600;margin-bottom:4px;}
  .kt-history-page2{
    margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);
  }
  .kt-history-page2-label{
    font-size:10.5px;color:var(--accent);font-weight:700;letter-spacing:0.05em;margin-bottom:4px;
  }
  .kt-history-memo{font-size:12px;color:var(--ink-soft);white-space:pre-wrap;}
  .kt-history-empty-note{font-size:12px;color:var(--ink-soft);text-align:center;padding:30px 10px;}

  .kt-photo-picker{display:flex;gap:10px;}
  .kt-photo-slot{
    flex:1;aspect-ratio:1/1;border:1.5px dashed var(--line);border-radius:14px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:6px;cursor:pointer;position:relative;overflow:hidden;background:var(--paper);
  }
  .kt-photo-slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .kt-photo-slot .kt-photo-slot-label{
    position:absolute;bottom:6px;left:6px;font-size:10px;background:rgba(74,59,70,0.65);color:#fff;
    padding:2px 8px;border-radius:20px;z-index:2;
  }
  .kt-photo-slot .kt-photo-slot-label-style{background:rgba(124,132,113,0.85);}
  .kt-photo-slot .kt-plus{font-size:22px;color:var(--ink-soft);}
  .kt-photo-slot .kt-plus-label{font-size:11px;color:var(--ink-soft);}
  .kt-photo-slot input[type=file]{display:none;}

  .kt-toast{
    position:absolute;left:50%;bottom:24px;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;
    opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;z-index:50;
  }
  .kt-toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

  .kt-note-banner{
    font-size:11px;color:#8A6D1F;background:#FFF6DE;border-radius:10px;
    padding:8px 12px;margin-bottom:14px;line-height:1.5;
  }
  .kt-interval-note{
    margin-top:10px;
    font-size:12.5px;
    color:var(--accent);
    font-weight:700;
    background:var(--accent-soft);
    border-radius:10px;
    padding:8px 12px;
    display:none;
  }
  .kt-interval-note.show{display:block;}
  .kt-interval-note.kt-interval-first{
    color:var(--ink-soft);
    background:var(--sage-soft);
  }
  .kt-time-picker-wrap{
    position:relative;height:150px;margin-top:8px;
    -webkit-mask-image:linear-gradient(to bottom, transparent 0%, black 30%, black 70%, transparent 100%);
    mask-image:linear-gradient(to bottom, transparent 0%, black 30%, black 70%, transparent 100%);
  }
  .kt-time-picker-track{
    display:flex;
    flex-direction:column;
    height:150px;
    overflow-y:auto;
    scroll-snap-type:y mandatory;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .kt-time-picker-track::-webkit-scrollbar{display:none;}
  .kt-time-item{
    flex:0 0 50px;
    height:50px;width:100%;
    display:flex;align-items:baseline;justify-content:center;gap:3px;
    scroll-snap-align:center;
    font-family:var(--font-display);
    font-size:16px;
    color:var(--ink-soft);
    opacity:0.5;
    transition:color .15s ease, font-size .15s ease, opacity .15s ease;
  }
  .kt-time-item.active{
    color:var(--accent);
    font-weight:700;
    font-size:24px;
    opacity:1;
  }
  .kt-time-item .kt-time-unit{font-size:11px;font-family:var(--font-body);}
  .kt-time-picker-indicator{
    position:absolute;left:0;right:0;top:50%;height:50px;
    transform:translateY(-50%);
    border-top:1.5px solid var(--accent);
    border-bottom:1.5px solid var(--accent);
    pointer-events:none;
  }
  .kt-time-picker-value{
    text-align:center;font-size:11px;color:var(--ink-soft);margin-top:2px;
  }
</style>

<div id="karte-root">

  <!-- ===== SCREEN 1: LIST ===== -->
  <div class="kt-screen active" id="screen-list">
    <div class="kt-header">
      <div class="kt-brand">HAIR SALON DIGITAL KARTE</div>
      <div class="kt-title">顧客カルテ <span id="karte-sync-status" style="font-size:11px;font-family:sans-serif;color:var(--sage);font-weight:400;margin-left:8px;letter-spacing:0;"></span></div>
      <div class="kt-search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="search-input" type="text" placeholder="カルテNo. または お名前（かな可）で検索" oninput="renderList()">
      </div>
      <div class="kt-indexrow">
        <div class="kt-gyou-scroll" id="gyou-chips"></div>
        <button class="kt-sort-toggle" id="sort-toggle" onclick="toggleSortMode()">No.順</button>
      </div>
      <div class="kt-indexrow" id="staff-filter-row">
        <span class="kt-staffrow-label">担当者</span>
        <div class="kt-gyou-scroll" id="staff-filter-chips"></div>
      </div>
    </div>
    <div class="kt-body" id="list-body" style="position:relative;">
      <div class="kt-count" id="list-count"></div>
      <div id="list-container"></div>
    </div>
    <button class="kt-fab" onclick="openNewCustomer()">＋ 新規顧客</button>
    <div class="kt-toast" id="toast"></div>
  </div>

  <!-- ===== SCREEN 2: CUSTOMER DETAIL ===== -->
  <div class="kt-screen" id="screen-detail">
    <div class="kt-topbar">
      <button class="kt-back" onclick="goToList()">←</button>
      <div style="flex:1;min-width:0;">
        <div class="kt-topbar-title" id="detail-name">—</div>
        <div class="kt-topbar-sub" id="detail-sub">—</div>
      </div>
      <button class="kt-back" onclick="openEditCustomer()" title="顧客情報を編集">✎</button>
    </div>
    <div class="kt-scroll" id="detail-scroll">
      <div class="kt-card" id="detail-info-card"></div>
      <div class="kt-card-label" style="margin:4px 0 10px 2px;">施術履歴</div>
      <div id="history-list"></div>
    </div>
    <button class="kt-fab" onclick="openNewTreatment()">＋ 施術記録を追加</button>
  </div>

  <!-- ===== SCREEN 3: NEW / EDIT CUSTOMER ===== -->
  <div class="kt-screen" id="screen-customer-form">
    <div class="kt-topbar">
      <button class="kt-back" onclick="cancelCustomerForm()">←</button>
      <div class="kt-topbar-title" id="customer-form-title">新規顧客登録</div>
    </div>
    <div class="kt-scroll">
      <div class="kt-note-banner">カルテNo.は登録時に自動採番されます。</div>
      <div class="kt-card">
        <div class="kt-field">
          <label>カルテNo.</label>
          <input id="cf-no" class="kt-readonly" readonly>
        </div>
        <div class="kt-field">
          <label>お名前（漢字）<span style="color:var(--accent);">＊必須</span></label>
          <input id="cf-name" placeholder="例）山田 花子">
        </div>
        <div class="kt-field">
          <label>フリガナ</label>

/* ====== GAS multi-device storage (with localStorage fallback) ====== */
/* ===== GAS_URLにデプロイしたウェブアプリのURLを貼り付けてください ===== */
var KARTE_GAS_URL = "ここにGASのウェブアプリURLを貼り付け";

(function(){
  var _cache = {};
  var _cacheLoaded = false;
  var _loadPromise = null;
  var _pending = {};   // {key: {action:'set'|'delete', value?}}
  var _saveTimer = null;
  var _syncEl = null;

  function getSyncEl(){
    if(!_syncEl){ _syncEl = document.getElementById('karte-sync-status'); }
    return _syncEl;
  }
  function setSyncStatus(s){
    var el = getSyncEl();
    if(el) el.textContent = s;
  }

  function loadFromLS(){
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);
      if(k) _cache[k]=localStorage.getItem(k);
    }
  }

  function loadFromGAS(){
    return new Promise(function(resolve){
      if(!KARTE_GAS_URL || KARTE_GAS_URL.indexOf('http')!==0){
        loadFromLS(); _cacheLoaded=true; resolve(); return;
      }
      setSyncStatus('同期中…');
      var done=false;
      var cb='karteCb_'+Date.now()+'_'+Math.floor(Math.random()*9999);
      var t=setTimeout(function(){
        if(!done){ done=true; delete window[cb];
          loadFromLS(); _cacheLoaded=true; setSyncStatus(''); resolve(); }
      },6000);
      window[cb]=function(data){
        clearTimeout(t);
        if(!done){ done=true; delete window[cb]; sc&&sc.remove();
          if(data&&data.items){
            data.items.forEach(function(it){
              _cache[it.key]=it.value;
              try{ localStorage.setItem(it.key, it.value); }catch(e){}
            });
          }
          _cacheLoaded=true; setSyncStatus('同期済み'); resolve();
        }
      };
      var sc=document.createElement('script');
      sc.src=KARTE_GAS_URL+'?action=list&callback='+cb;
      sc.onerror=function(){
        clearTimeout(t);
        if(!done){ done=true; delete window[cb];
          loadFromLS(); _cacheLoaded=true; setSyncStatus('オフライン'); resolve(); }
      };
      document.head.appendChild(sc);
    });
  }

  function ensureLoaded(){
    if(_cacheLoaded) return Promise.resolve();
    if(!_loadPromise) _loadPromise=loadFromGAS();
    return _loadPromise;
  }

  function scheduleSave(key, action, value){
    _pending[key]={action:action, value:value};
    clearTimeout(_saveTimer);
    _saveTimer=setTimeout(flush, 600);
  }

  function flush(){
    if(!KARTE_GAS_URL || KARTE_GAS_URL.indexOf('http')!==0) return;
    var items=Object.keys(_pending).map(function(k){
      return {key:k, action:_pending[k].action, value:_pending[k].value};
    });
    if(!items.length) return;
    _pending={};
    setSyncStatus('保存中…');
    fetch(KARTE_GAS_URL,{
      method:'POST', mode:'no-cors',
      body:JSON.stringify({action:'bulkSet', items:items})
    }).then(function(){ setSyncStatus('同期済み'); })
    .catch(function(){ setSyncStatus('保存エラー（ローカルには保存済み）'); });
  }

  window.storage = {
    get: async function(key){
      await ensureLoaded();
      return _cache.hasOwnProperty(key) ? {value:_cache[key]} : null;
    },
    set: async function(key, value){
      await ensureLoaded();
      _cache[key]=value;
      try{ localStorage.setItem(key, value); }catch(e){}
      scheduleSave(key,'set',value);
      return {key:key, value:value};
    },
    delete: async function(key){
      await ensureLoaded();
      delete _cache[key];
      try{ localStorage.removeItem(key); }catch(e){}
      scheduleSave(key,'delete',null);
      return {key:key, deleted:true};
    },
    list: async function(prefix){
      await ensureLoaded();
      var keys=Object.keys(_cache).filter(function(k){
        return !prefix || k.startsWith(prefix);
      });
      return {keys:keys};
    }
  };
})();

  // ---------- utils ----------
  function toast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); }, 1600);
  }
  function todayStr(){
    var d = new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function fmtDate(s){
    if(!s) return '—';
    var p = s.split('-');
    return p[0]+'年'+parseInt(p[1])+'月'+parseInt(p[2])+'日';
  }
  function daysAgo(s){
    if(!s) return 9999;
    var d = new Date(s+'T00:00:00');
    var now = new Date();
    return Math.floor((now - d) / (1000*60*60*24));
  }
  // normalize katakana -> hiragana for kana search tolerance
  function toHiragana(str){
    return (str||'').replace(/[\u30a1-\u30f6]/g, function(m){
      return String.fromCharCode(m.charCodeAt(0) - 0x60);
    });
  }
  function compressImage(file){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(e){
        var img = new Image();
        img.onload = function(){
          var maxW = 640;
          var scale = Math.min(1, maxW / img.width);
          var canvas = document.createElement('canvas');
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL('image/jpeg', 0.6));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  window.renderList = async function(){
    renderGyouChips();
    renderStaffFilterChips();
    var q = (document.getElementById('search-input').value || '').trim();
    var qHira = toHiragana(q);
    var list = state.customers.slice();

    if(q){
      list = list.filter(function(c){
        var nameMatch = (c.name||'').indexOf(q) !== -1;
        var noMatch = String(c.no) === q || String(c.no).indexOf(q) !== -1;
        var kanaMatch = toHiragana(c.kana||'').indexOf(qHira) !== -1;
        var staffMatch = (c.staffHistory||[]).some(function(s){ return s.indexOf(q) !== -1; });
        return nameMatch || noMatch || kanaMatch || staffMatch;
      });
    }

    if(state.selectedGyou){
      list = list.filter(function(c){ return getGyou(c.kana) === state.selectedGyou; });
    }

    if(state.selectedStaffFilter){
      list = list.filter(function(c){ return (c.staffHistory||[]).indexOf(state.selectedStaffFilter) !== -1; });
    }

    if(state.sortMode === 'kana'){
      list.sort(function(a,b){ return toHiragana(a.kana||'').localeCompare(toHiragana(b.kana||''), 'ja'); });
    } else {
      list.sort(function(a,b){ return a.no - b.no; });
    }

    var countEl = document.getElementById('list-count');
    var isFiltered = q || state.selectedGyou || state.selectedStaffFilter;
    var countLabel = isFiltered ? (list.length + ' 件ヒット') : ('全 ' + list.length + ' 件');
    countEl.textContent = countLabel;

    var container = document.getElementById('list-container');
    if(list.length === 0){

      return;

    var html = '';
    list.forEach(function(c){
      var da = c.lastVisit ? daysAgo(c.lastVisit) : null;

      if(da !== null){
        if(da <= 45) tabClass = 'recent';

      html += '<div class="kt-row" onclick="openCustomer(\''+c.id+'\')">' +

  window.updateIntervalNote = function(){
    var note = document.getElementById('tf-interval-note');
    var dateVal = document.getElementById('tf-date').value;
    if(!dateVal){ note.className = 'kt-interval-note'; note.textContent=''; return; }

    var others = state.currentTreatments.filter(function(t){ return t.id !== state.editingTreatmentId; });
    var prevCandidates = others.filter(function(t){ return t.date < dateVal; });
    prevCandidates.sort(function(a,b){ return a.date < b.date ? 1 : -1; }); // 新しい順
    var prev = prevCandidates[0];

    if(!prev){
      note.textContent = '初回のご来店です';
      note.className = 'kt-interval-note show kt-interval-first';
      return;
    }

    var days = Math.round((new Date(dateVal+'T00:00:00') - new Date(prev.date+'T00:00:00')) / (1000*60*60*24));
    var extra = '';
    if(days >= 60){ extra = '（約'+Math.round(days/30)+'ヶ月ぶり）'; }
    else if(days >= 14){ extra = '（約'+Math.round(days/7)+'週間ぶり）'; }
    note.textContent = '前回来店（'+fmtDate(prev.date)+'）から '+days+'日'+extra;
    note.className = 'kt-interval-note show';
  };

  // ---------- タイム：5分刻みドラムロール式ピッカー（120分まで） ----------
  var TIME_STEP_MIN = 5;
  var TIME_MAX_MIN = 120;
  var timeScrollDebounce = null;

  function buildTimePicker(){
    var track = document.getElementById('time-picker-track');
    var wrap = track.parentElement;
    var wrapHeight = wrap.offsetHeight || 150;
    var pad = Math.max(0, (wrapHeight - 50) / 2);
    var html = '<div style="flex:0 0 '+pad+'px;"></div>';
    for(var m = 0; m <= TIME_MAX_MIN; m += TIME_STEP_MIN){
      html += '<div class="kt-time-item" data-min="'+m+'">'+m+'<span class="kt-time-unit">分</span></div>';
    }
    html += '<div style="flex:0 0 '+pad+'px;"></div>';
    track.innerHTML = html;
    track.onscroll = onTimeScroll;
  }

  function onTimeScroll(){
    highlightCenteredTimeItem(false);
    clearTimeout(timeScrollDebounce);
    timeScrollDebounce = setTimeout(function(){ highlightCenteredTimeItem(true); }, 90);
  }

  function highlightCenteredTimeItem(commit){
    var track = document.getElementById('time-picker-track');
    if(!track) return;
    var wrap = track.parentElement;
    var center = track.scrollTop + wrap.offsetHeight / 2;
    var items = track.querySelectorAll('.kt-time-item');
    var closest = null, closestDist = Infinity;
    items.forEach(function(it){
      var itemCenter = it.offsetTop + it.offsetHeight / 2;
      var dist = Math.abs(itemCenter - center);
      if(dist < closestDist){ closestDist = dist; closest = it; }
    });
    items.forEach(function(it){ it.classList.remove('active'); });
    if(closest){
      closest.classList.add('active');
      if(commit){
        var minutes = parseInt(closest.getAttribute('data-min'), 10);
        document.getElementById('tf-time').value = minutes + '分';
        document.getElementById('time-picker-value').textContent = minutes + '分';
      }
    }
  }

  function parseMinutesFromTimeText(text){
    if(!text) return 0;
    var match = text.match(/(\d+)/);
    if(!match) return 0;
    var n = parseInt(match[1], 10);
    n = Math.round(n / TIME_STEP_MIN) * TIME_STEP_MIN;
    if(n < 0) n = 0;
    if(n > TIME_MAX_MIN) n = TIME_MAX_MIN;

      .map(function(r){ return r.ratio.trim() ? ('・'+r.name.trim()+'：'+r.ratio.trim()) : ('・'+r.name.trim()); })
      .join('\n');
  }
  function buildRecipeRowsFromTreatment(t){
    var rows = [];
    if(t.recipeItems && t.recipeItems.length){
      rows = t.recipeItems.map(function(r){ return { name: r.name||'', ratio: r.ratio||'' }; });
    } else if(t.recipe){
      // 旧バージョン（自由記述）からの移行：1行＝1枠として読み込む
      t.recipe.split('\n').forEach(function(line){
        var clean = line.replace(/^・/, '');
        var parts = clean.split('：');
        if(parts.length >= 2){ rows.push({ name: parts[0], ratio: parts.slice(1).join('：') }); }
        else if(clean.trim()){ rows.push({ name: clean.trim(), ratio: '' }); }
      });
    }
    while(rows.length < 3){ rows.push({ name:'', ratio:'' }); }
    return rows;
  }

  // 施術記録の保存/削除のたびに、顧客ごとの「担当履歴」を再集計する
  function recomputeStaffListForCustomer(customer, treatments){
    var seen = {};
    var list = [];
    treatments.forEach(function(t){
      if(t.staff && !seen[t.staff]){ seen[t.staff] = true; list.push(t.staff); }
    });
    customer.staffHistory = list;
  }

  function resetPhotoSlot(kind){
    var slot = document.getElementById('slot-'+kind);
    slot.querySelectorAll('img').forEach(function(i){ i.remove(); });
  }
  function setPhotoSlot(kind, dataUrl){
    resetPhotoSlot(kind);
    if(dataUrl){
      var slot = document.getElementById('slot-'+kind);
      var img = document.createElement('img');
      img.src = dataUrl;
      slot.insertBefore(img, slot.firstChild);
    }
  }

  window.handlePhoto = async function(evt, kind){
    var file = evt.target.files[0];
    if(!file) return;
    toast('写真を処理中…');
    try{
      var dataUrl = await compressImage(file);
      pendingPhotos[kind] = dataUrl;
      setPhotoSlot(kind, dataUrl);
    }catch(e){
      toast('写真の読み込みに失敗しました');
    }
  };

  window.saveTreatment = async function(){
    var date = document.getElementById('tf-date').value || todayStr();
    var recipeItems = state.recipeRows
      .filter(function(r){ return r.name.trim() || r.ratio.trim(); })
      .map(function(r){ return { name: r.name.trim(), ratio: r.ratio.trim() }; });
    var recipe = buildRecipeTextFromRows(state.recipeRows);
    var menuChoices = state.selectedMenu.slice();
    var oxidantChoices = state.selectedOxidant.slice();
    var applicationMethods = state.selectedApplication.slice();

    var page2Enabled = state.page2Enabled;
    var recipeItems2 = page2Enabled ? state.recipeRows2
      .filter(function(r){ return r.name.trim() || r.ratio.trim(); })
      .map(function(r){ return { name: r.name.trim(), ratio: r.ratio.trim() }; }) : [];
    var recipe2 = page2Enabled ? buildRecipeTextFromRows(state.recipeRows2) : '';
    var oxidantChoices2 = page2Enabled ? state.selectedOxidant2.slice() : [];
    var applicationMethods2 = page2Enabled ? state.selectedApplication2.slice() : [];
    var time2 = page2Enabled ? document.getElementById('tf-time-2').value.trim() : '';

    var time = document.getElementById('tf-time').value.trim();
    var priceRaw = document.getElementById('tf-price').value;
    var price = priceRaw === '' ? null : Math.max(0, Math.round(Number(priceRaw)));
    var staff = document.getElementById('tf-staff').value.trim();
    var memo = document.getElementById('tf-memo').value.trim();
    var customerId = state.currentCustomerId;

    if(state.editingTreatmentId){
      var t = state.currentTreatments.find(function(x){ return x.id === state.editingTreatmentId; });
      t.date = date; t.recipe = recipe; t.recipeItems = recipeItems; t.menuChoices = menuChoices; t.oxidantChoices = oxidantChoices; t.applicationMethods = applicationMethods; t.time = time; t.price = price; t.staff = staff; t.memo = memo;
      t.page2Enabled = page2Enabled; t.recipe2 = recipe2; t.recipeItems2 = recipeItems2; t.oxidantChoices2 = oxidantChoices2; t.applicationMethods2 = applicationMethods2; t.time2 = time2;
      t.beforePhoto = pendingPhotos.before; t.afterPhoto = pendingPhotos.after; t.stylePhoto = pendingPhotos.style;
    } else {
      state.currentTreatments.push({
        id: 't_' + Date.now() + '_' + Math.floor(Math.random()*1000),
        date: date, recipe: recipe, recipeItems: recipeItems, menuChoices: menuChoices, oxidantChoices: oxidantChoices, applicationMethods: applicationMethods, time: time, price: price, staff: staff, memo: memo,
        page2Enabled: page2Enabled, recipe2: recipe2, recipeItems2: recipeItems2, oxidantChoices2: oxidantChoices2, applicationMethods2: applicationMethods2, time2: time2,
        beforePhoto: pendingPhotos.before, afterPhoto: pendingPhotos.after, stylePhoto: pendingPhotos.style,
        createdAt: Date.now()
      });
    }
    await saveTreatmentsFor(customerId, state.currentTreatments);

    // update lastVisit and staff history on customer index
    var c = state.customers.find(function(x){ return x.id === customerId; });
    var maxDate = state.currentTreatments.reduce(function(m,x){ return (!m || x.date > m) ? x.date : m; }, null);
    c.lastVisit = maxDate;
    recomputeStaffListForCustomer(c, state.currentTreatments);
    await saveIndex(state.customers);

    toast('施術記録を保存しました');
    showScreen('screen-detail');
    renderHistory();
    document.getElementById('detail-sub').textContent = 'カルテ No.' + c.no + (c.kana ? ' ・ ' + c.kana : '');
  };

  window.deleteTreatment = async function(){
    if(!confirm('この施術記録を削除しますか？')) return;
    var id = state.editingTreatmentId;
    state.currentTreatments = state.currentTreatments.filter(function(x){ return x.id !== id; });
    await saveTreatmentsFor(state.currentCustomerId, state.currentTreatments);
    var c = state.customers.find(function(x){ return x.id === state.currentCustomerId; });
    var maxDate = state.currentTreatments.reduce(function(m,x){ return (!m || x.date > m) ? x.date : m; }, null);
    c.lastVisit = maxDate;
    recomputeStaffListForCustomer(c, state.currentTreatments);
    await saveIndex(state.customers);
    toast('削除しました');
    showScreen('screen-detail');
    renderHistory();
  };

  // ---------- init ----------
  async function init(){
    var idx = await loadIndex();
    if(idx.length === 0){
      // seed with a couple of sample customers so the mockup is demonstrable
      idx = [
        { id:'c_seed_1', no:1, name:'山田 花子', kana:'ヤマダ ハナコ', phone:'090-1234-5678', memo:'頭皮が敏感。低刺激の薬剤を希望。', lastVisit: todayStr(), createdAt: Date.now() },
        { id:'c_seed_2', no:2, name:'佐藤 美咲', kana:'サトウ ミサキ', phone:'080-9876-5432', memo:'', lastVisit: null, createdAt: Date.now() }
      ];
      await saveIndex(idx);
      await saveMeta({ next: 3 });
    }
    state.customers = idx;
    var storedA = await loadMenuItemsA();
    var storedB = await loadMenuItemsB();
    if(storedA === null && storedB === null){
      // ①②分割前の旧メニュー一覧が残っていれば、カテゴリに応じて振り分けて移行する
      var legacy = await loadLegacyMenuItems();
      if(legacy && legacy.length){
        state.menuItemsA = [];
        state.menuItemsB = [];
        legacy.forEach(function(item){
          if(LEGACY_MENU_CATEGORY_A.indexOf(item) !== -1){ state.menuItemsA.push(item); }
          else { state.menuItemsB.push(item); }
        });
        if(state.menuItemsA.length === 0){ state.menuItemsA = DEFAULT_MENU_ITEMS_A.slice(); }
        if(state.menuItemsB.length === 0){ state.menuItemsB = DEFAULT_MENU_ITEMS_B.slice(); }
      } else {
        state.menuItemsA = DEFAULT_MENU_ITEMS_A.slice();
        state.menuItemsB = DEFAULT_MENU_ITEMS_B.slice();
      }
      await saveMenuItemsAToStorage(state.menuItemsA);
      await saveMenuItemsBToStorage(state.menuItemsB);
    } else {
      state.menuItemsA = storedA || DEFAULT_MENU_ITEMS_A.slice();
      state.menuItemsB = storedB || DEFAULT_MENU_ITEMS_B.slice();
    }
    var menuAChanged = false;
    MENU_ITEMS_A_ADDED_2026_07.forEach(function(item){
      if(state.menuItemsA.indexOf(item) === -1){ state.menuItemsA.push(item); menuAChanged = true; }
    });
    if(menuAChanged){ await saveMenuItemsAToStorage(state.menuItemsA); }
    MENU_ITEMS_A_ADDED_2026_07_V2.forEach(function(item){
      if(state.menuItemsA.indexOf(item) === -1){ state.menuItemsA.push(item); menuAChanged = true; }
    });
    if(menuAChanged){ await saveMenuItemsAToStorage(state.menuItemsA); }
    var menuBChanged = false;
    MENU_ITEMS_B_ADDED_2026_07.forEach(function(item){
      if(state.menuItemsB.indexOf(item) === -1){ state.menuItemsB.push(item); menuBChanged = true; }
    });
    if(menuBChanged){ await saveMenuItemsBToStorage(state.menuItemsB); }
    state.staffList = await loadStaffList();
    state.oxidantItems = await loadOxidantItems();
    state.applicationItems = await loadApplicationItems();
    var applicationChanged = false;
    APPLICATION_ITEMS_ADDED_2026_07.forEach(function(item){
      if(state.applicationItems.indexOf(item) === -1){ state.applicationItems.push(item); applicationChanged = true; }
    });
    if(applicationChanged){ await saveApplicationItemsToStorage(state.applicationItems); }
    // リタッチカラー・全体カラーは「最初の方」に追加する指定なので、先頭寄りに挿入する
    var applicationV2Changed = false;
    APPLICATION_ITEMS_ADDED_2026_07_V2.slice().reverse().forEach(function(item){
      if(state.applicationItems.indexOf(item) === -1){
        state.applicationItems.unshift(item);
        applicationV2Changed = true;
      }
    });
    if(applicationV2Changed){ await saveApplicationItemsToStorage(state.applicationItems); }
    var applicationV3Changed = false;
    APPLICATION_ITEMS_ADDED_2026_07_V3.forEach(function(item){
      if(state.applicationItems.indexOf(item) === -1){ state.applicationItems.push(item); applicationV3Changed = true; }
    });
    if(applicationV3Changed){ await saveApplicationItemsToStorage(state.applicationItems); }
    state.shampooItems = await loadShampooItems();
    renderList();
  }
  init();

  // expose for Claude-artifact sendPrompt compatibility (not required, safe no-op if unused)
})();
</script>
